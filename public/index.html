<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>MyCricStats</title>
<meta name="theme-color" content="#01002C"/>
<link rel="manifest" href="/manifest.webmanifest"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="MyCricStats"/>
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"/>
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png"/>
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#01002C;--bg2:#0a0a3a;--card:#12123f;--line:rgba(255,255,255,.12);--text:#f8fafc;--muted:#a8a8c8;--red:#FF0F50;--gold:#fbbf24;--blue:#7dd3fc;--accent:#FF0F50}
body.theme-dark{--bg:#01002C;--bg2:#0a0a3a;--card:#12123f}
body.theme-light{--bg:#f4f4f8;--bg2:#fff;--card:#fff;--line:rgba(1,0,44,.12);--text:#01002C;--muted:#5c5c7a;--accent:#FF0F50;--blue:#0284c7;--gold:#b45309}
body.theme-pitch{--bg:#062816;--bg2:#0c3d22;--card:#0f4a2a;--line:rgba(52,211,153,.2);--text:#ecfdf5;--muted:#6ee7b7;--accent:#10b981;--blue:#34d399}
body.theme-night{--bg:#0b1020;--bg2:#151b2e;--card:#1c2438}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Montserrat,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
.app{max-width:480px;margin:0 auto;padding-bottom:32px;min-height:100vh}
.broadcast{position:relative;background:#01002C;border-bottom:1px solid var(--line);padding:12px 14px 14px;overflow:hidden;min-height:28vh;display:flex;flex-direction:column;justify-content:center}
.broadcast .bg-layer{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
.broadcast .bg-overlay{position:absolute;inset:0;background:#01002C;z-index:1}
.broadcast .bc-content{position:relative;z-index:2}
.bar{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:6px;min-height:34px}
.live-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,15,80,.2);border:1px solid rgba(255,15,80,.5);color:#fecdd3;font-size:11px;font-weight:900;padding:4px 10px;border-radius:999px;margin-right:auto}
.live-pill i{width:7px;height:7px;border-radius:50%;background:#FF0F50;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.done-pill{font-size:10px;font-weight:800;color:#94a3b8;background:rgba(148,163,184,.15);padding:4px 10px;border-radius:999px;margin-right:auto}
.icon-btn{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;border-radius:999px;width:34px;height:34px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;font-family:inherit}
.view-badge{font-size:10px;font-weight:800;background:rgba(255,15,80,.2);color:#F78DA7;padding:3px 8px;border-radius:999px;margin-right:auto}
.match-header{text-align:center;padding:2px 4px 4px}
.match-header .title{font-size:14px;font-weight:900;color:var(--gold);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.match-header .sub{font-size:11px;font-weight:700;color:#cbd5e1;margin-top:2px}
.match-header .status-line{font-size:12px;font-weight:700;color:#e2e8f0;margin-top:4px}
.score-grid{display:grid;grid-template-columns:1fr 40px 1fr;gap:4px;align-items:center;margin-top:8px}
.side{text-align:center;min-width:0;padding:0 2px}
.tname{font-size:11px;font-weight:800;text-transform:uppercase;color:#f8fafc;display:flex;align-items:center;justify-content:center;gap:4px}
.tname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-left .tname{justify-content:flex-start}
.side-right .tname{justify-content:flex-end}
.score-num{font-size:30px;font-weight:900;line-height:1.1;margin:4px 0 0;color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 0 18px rgba(255,15,80,.3)}
.overs{font-size:11px;color:#cbd5e1;font-weight:700;margin-top:2px}
.match-center .vs-label{font-size:11px;font-weight:900;letter-spacing:.12em;color:#94a3b8;text-align:center}
.meta-row{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:11px;color:#cbd5e1;font-weight:600}
.tabs{display:flex;gap:0;overflow-x:auto;background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.tabs button{flex:0 0 auto;border:0;background:transparent;color:var(--muted);font-family:inherit;font-weight:800;font-size:12px;padding:13px 12px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.panel{padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 10px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800}
.muted{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:rgba(127,127,127,.08);color:var(--text);border-radius:999px;padding:8px 14px;font-weight:800;font-size:12px;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.filter-row{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.filter-row button{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--muted);font-family:inherit;font-weight:800;font-size:11px;padding:7px 12px;border-radius:999px;cursor:pointer}
.filter-row button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.match-list{display:flex;flex-direction:column;gap:8px}
.match-card{padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer}
body.theme-light .match-card{background:#fff}
.match-card.is-live{border-color:rgba(255,15,80,.45)}
.match-card.is-sel{border-color:rgba(255,15,80,.6);background:rgba(255,15,80,.08)}
.mc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.mc-live{font-size:10px;font-weight:900;color:#fecdd3;background:rgba(255,15,80,.25);padding:2px 8px;border-radius:999px}
.mc-fin{font-size:10px;font-weight:800;color:#94a3b8;background:rgba(148,163,184,.15);padding:2px 8px;border-radius:999px}
.mc-up{font-size:10px;font-weight:800;color:#7dd3fc;background:rgba(56,189,248,.15);padding:2px 8px;border-radius:999px}
.mc-meta{font-size:11px;color:var(--muted)}
.mc-teams{font-size:14px;font-weight:800;margin:2px 0}
.mc-scores{font-size:17px;font-weight:900;margin:4px 0;color:var(--blue)}
.table{width:100%;border-collapse:collapse;font-size:12px}
.table th{text-align:left;color:var(--muted);font-weight:800;padding:6px 4px;border-bottom:1px solid var(--line);font-size:10px;text-transform:uppercase}
.table td{padding:7px 4px;border-bottom:1px solid var(--line);font-weight:600}
.empty{text-align:center;padding:36px 16px;color:var(--muted);font-size:14px}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(127,127,127,.3);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.error-bar{background:#3b0715;color:#fecaca;font-size:13px;padding:10px 14px;text-align:center;font-weight:600;line-height:1.4}
body.theme-light .error-bar{background:#fef2f2;color:#991b1b}
.footer{text-align:center;padding:16px;font-size:11px;color:var(--muted)}
.settings-dd{position:fixed;right:12px;top:12px;z-index:9999;background:var(--bg2);border:1px solid var(--line);border-radius:14px;min-width:280px;max-width:92vw;max-height:80vh;overflow:auto;padding:8px;box-shadow:0 16px 40px rgba(0,0,0,.5)}
.settings-dd .dd-title{font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 12px}
.settings-dd button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--text);font-weight:700;font-size:13px;padding:11px 12px;border-radius:10px;cursor:pointer;font-family:inherit}
.settings-dd button:hover,.settings-dd button.on{background:rgba(255,15,80,.15)}
.settings-backdrop{position:fixed;inset:0;z-index:9998}
.modal-scrim{position:fixed;inset:0;z-index:10050;background:rgba(1,0,44,.75);display:flex;align-items:center;justify-content:center;padding:16px}
.modal-card{width:min(420px,94vw);background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:18px;color:var(--text);max-height:90vh;overflow:auto}
.modal-card h2{font-size:16px;font-weight:900;margin:0 0 6px}
.modal-card .hint{font-size:12px;color:var(--muted);line-height:1.45;margin-bottom:12px}
.modal-card .hint a{color:var(--blue)}
.modal-card .field{margin-bottom:12px}
.modal-card .field label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.modal-card .field input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-family:inherit;font-size:14px;font-weight:600}
.modal-card .actions{display:flex;gap:8px;margin-top:14px}
.modal-card .actions .btn{flex:1;padding:12px;border-radius:12px}
.opacity-row{display:flex;align-items:center;gap:10px;margin-top:8px}
.opacity-row input[type=range]{flex:1}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv .item{background:rgba(127,127,127,.06);border:1px solid var(--line);border-radius:12px;padding:10px}
.kv .item .k{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase}
.kv .item .v{font-size:13px;font-weight:800;margin-top:4px;word-break:break-word}
.ad-overlay{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;background:rgba(1,0,44,.6);padding:16px}
.ad-card{background:#0a0a3a;color:#fff;border-radius:16px;padding:14px;max-width:360px;width:100%;position:relative;text-align:center;border:1px solid rgba(255,15,80,.3)}
.ad-card img{max-width:100%;max-height:220px;border-radius:10px;margin:8px auto;display:block}
.ad-close{position:absolute;top:8px;right:10px;border:0;background:rgba(127,127,127,.3);color:inherit;width:28px;height:28px;border-radius:50%;cursor:pointer;font-weight:900}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:10001;background:#166534;color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700}
body.theme-light .tabs,body.theme-light .settings-dd,body.theme-light .modal-card{background:#fff}
body.theme-light .settings-dd button{color:#01002C}
body.theme-light .broadcast .title,body.theme-light .broadcast .sub,body.theme-light .broadcast .status-line,
body.theme-light .broadcast .tname,body.theme-light .broadcast .score-num,body.theme-light .broadcast .overs,body.theme-light .broadcast .meta-row,body.theme-light .broadcast .vs-label{color:#f8fafc!important}
</style>
</head>
<body class="theme-dark">
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script>
(function(){
'use strict';
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}
if(!window.React||!window.ReactDOM){document.getElementById('root').innerHTML='<div style="padding:20px;color:#fecaca">React failed to load</div>';return;}
var h=React.createElement,useState=React.useState,useEffect=React.useEffect,useCallback=React.useCallback;
var THEMES=['dark','light','pitch','night'];
var CACHE_MS=45000;
var memCache={};
var DEFAULT_BG='https://images.unsplash.com/photo-1531415074968-036ba1b575da?auto=format&fit=crop&w=1200&q=60';

function qs(){try{return new URLSearchParams(location.search);}catch(e){return new URLSearchParams();}}
function isViewMode(){return qs().get('view')==='1';}
function lsGet(k,fb){try{var v=localStorage.getItem(k);return v==null?fb:v;}catch(e){return fb;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function lsJSON(k,fb){try{var v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch(e){return fb;}}
function lsJSONSet(k,o){try{localStorage.setItem(k,JSON.stringify(o));}catch(e){}}
function cacheGet(key){var m=memCache[key];if(m&&Date.now()-m.t<m.ttl)return m.d;try{var raw=localStorage.getItem('sm_cache_'+key);if(raw){var o=JSON.parse(raw);if(o&&Date.now()-o.t<o.ttl){memCache[key]=o;return o.d;}}}catch(e){}return null;}
function cacheSet(key,data,ttl){var o={t:Date.now(),ttl:ttl||CACHE_MS,d:data};memCache[key]=o;try{localStorage.setItem('sm_cache_'+key,JSON.stringify(o));}catch(e){}}
function cacheClear(){memCache={};try{Object.keys(localStorage).forEach(function(k){if(k.indexOf('sm_cache_')===0)localStorage.removeItem(k);});}catch(e){}}

function ymd(d){var x=d||new Date();return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}

async function fetchJson(url){
  var res=await fetch(url);
  if(!res.ok){
    var t='';try{t=await res.text();}catch(e){}
    var msg='HTTP '+res.status;
    try{var j=JSON.parse(t);if(j.message)msg+=' — '+j.message;else if(t)msg+=': '+t.slice(0,120);}catch(e){if(t)msg+=': '+t.slice(0,120);}
    if(res.status===404)msg='HTTP 404 — API proxy missing. On Pages set output dir = public and keep functions/api/proxy.js';
    throw new Error(msg);
  }
  return res.json();
}
async function smGet(url){
  var cacheKey=url.replace(/api_token=[^&]+/,'api_token=***');
  var cached=cacheGet(cacheKey);
  if(cached)return{data:cached,fromCache:true};
  var json=await fetchJson(url);
  if(json.message&&json.data==null&&!Array.isArray(json.data))throw new Error(json.message);
  if(json.error)throw new Error(typeof json.error==='string'?json.error:(json.error.message||JSON.stringify(json.error)));
  var data=json.data!=null?json.data:json;
  cacheSet(cacheKey,data,CACHE_MS);
  return{data:data,fromCache:false};
}
function ckUrl(path,token,include){
  var u='/api/proxy?sport=cricket&path='+encodeURIComponent(path.replace(/^\//,''))+'&api_token='+encodeURIComponent(token);
  if(include)u+='&include='+encodeURIComponent(include);
  return u;
}
function teamName(m,side){
  if(side==='local')return(m.localteam&&m.localteam.name)||m.localteam_id||'Home';
  return(m.visitorteam&&m.visitorteam.name)||m.visitorteam_id||'Away';
}
function scoreLine(m){
  var runs=m.runs||[];
  var a='—',b='—';
  if(runs[0]!=null)a=(runs[0].score!=null?runs[0].score:'—')+(runs[0].wickets!=null?'/'+runs[0].wickets:'')+(runs[0].overs!=null?' ('+runs[0].overs+')':'');
  if(runs[1]!=null)b=(runs[1].score!=null?runs[1].score:'—')+(runs[1].wickets!=null?'/'+runs[1].wickets:'')+(runs[1].overs!=null?' ('+runs[1].overs+')':'');
  // scoreboards fallback
  if(a==='—'&&b==='—'&&m.scoreboards){
    var totals=(m.scoreboards||[]).filter(function(s){return s.type==='total'||s.total!=null;});
    if(totals[0])a=totals[0].total+(totals[0].wickets!=null?'/'+totals[0].wickets:'')+(totals[0].overs!=null?' ('+totals[0].overs+')':'');
    if(totals[1])b=totals[1].total+(totals[1].wickets!=null?'/'+totals[1].wickets:'')+(totals[1].overs!=null?' ('+totals[1].overs+')':'');
  }
  return{a:a,b:b};
}
function statusOf(m){
  if(m.live)return 'live';
  var s=String(m.status||'').toLowerCase();
  if(s.indexOf('finish')>=0||s==='finished'||s==='ended'||m.winner_team_id)return 'finished';
  if(s.indexOf('1st')>=0||s.indexOf('2nd')>=0||s.indexOf('innings')>=0||s.indexOf('live')>=0)return 'live';
  return 'upcoming';
}
function shortName(n){if(!n)return'—';n=String(n);return n.length>16?n.slice(0,15)+'…':n;}
function fmtWhen(iso){
  if(!iso)return'';
  try{var d=new Date(iso);if(isNaN(d))return String(iso).slice(0,16);return d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){return String(iso).slice(0,16);}
}

function App(){
  var viewOnly=isViewMode();
  var shareId=qs().get('match')||'';
  var _token=useState(function(){return lsGet('sportmonks_token','');});
  var token=_token[0],setToken=_token[1];
  var _matches=useState([]);var matches=_matches[0],setMatches=_matches[1];
  var _selected=useState(null);var selected=_selected[0],setSelected=_selected[1];
  var _detail=useState(null);var detail=_detail[0],setDetail=_detail[1];
  var _tab=useState('matches');var tab=_tab[0],setTab=_tab[1];
  var _filter=useState('all');var filter=_filter[0],setFilter=_filter[1];
  var _loading=useState(false);var loading=_loading[0],setLoading=_loading[1];
  var _error=useState(null);var error=_error[0],setError=_error[1];
  var _settings=useState(false);var settingsOpen=_settings[0],setSettingsOpen=_settings[1];
  var _theme=useState(function(){return lsGet('cric_theme','dark');});
  var theme=_theme[0],setTheme=_theme[1];
  var _bg=useState(function(){return lsGet('bg_cricket',DEFAULT_BG);});
  var bgUrl=_bg[0],setBgUrl=_bg[1];
  var _op=useState(function(){return parseFloat(lsGet('op_cricket','0.55'))||0.55;});
  var bgOp=_op[0],setBgOp=_op[1];
  var _ads=useState(function(){return lsJSON('cric_ads_v1',{enabled:true,items:[{event:'wicket',image:'',text:'Sponsor',duration:4}]});});
  var ads=_ads[0],setAds=_ads[1];
  var _adShow=useState(null);var adShow=_adShow[0],setAdShow=_adShow[1];
  var _toast=useState(null);var toast=_toast[0],setToast=_toast[1];
  var _modal=useState(null);var modal=_modal[0],setModal=_modal[1];
  var _modalVal=useState('');var modalVal=_modalVal[0],setModalVal=_modalVal[1];
  var _adminAds=useState(false);var adminAds=_adminAds[0],setAdminAds=_adminAds[1];

  useEffect(function(){document.body.className='theme-'+theme;},[theme]);

  var loadList=useCallback(function(force){
    if(!token){setError('Add Sportmonks token in Settings ⚙');return;}
    setLoading(true);setError(null);
    if(force)cacheClear();
    var include='localteam,visitorteam,runs,league,venue,scoreboards';
    var today=ymd(new Date());
    var past=ymd(addDays(new Date(),-3));
    var future=ymd(addDays(new Date(),5));
    // live + recent fixtures + upcoming window
    Promise.all([
      smGet(ckUrl('livescores',token,include)).catch(function(){return{data:[]};}),
      smGet(ckUrl('fixtures',token,include)+'&filter[starts_between]='+past+','+future).catch(function(){
        // fallback without filter
        return smGet(ckUrl('fixtures/'+today,token,include)).catch(function(){return{data:[]};});
      })
    ]).then(function(results){
      var live=Array.isArray(results[0].data)?results[0].data:[];
      var fix=Array.isArray(results[1].data)?results[1].data:[];
      var map={};
      live.concat(fix).forEach(function(m){if(m&&m.id!=null)map[m.id]=m;});
      var list=Object.keys(map).map(function(k){return map[k];});
      list.sort(function(a,b){
        var sa=statusOf(a),sb=statusOf(b);
        var rank={live:0,upcoming:1,finished:2};
        if(rank[sa]!==rank[sb])return rank[sa]-rank[sb];
        return String(b.starting_at||'').localeCompare(String(a.starting_at||''));
      });
      setMatches(list);
      if(shareId){
        var m=list.find(function(x){return String(x.id)===String(shareId);});
        if(m){setSelected(m);setTab('scorecard');loadDetail(m,token);}
      }
    }).catch(function(e){setError(e.message||'Load failed');})
     .finally(function(){setLoading(false);});
  },[token,shareId]);

  useEffect(function(){if(token)loadList(false);},[token]);

  function loadDetail(m,tok){
    tok=tok||token;
    if(!tok||!m)return;
    setLoading(true);
    smGet(ckUrl('fixtures/'+m.id,tok,'localteam,visitorteam,runs,batting,bowling,scoreboards,league,venue,lineup,balls,tosswon,manofmatch'))
      .then(function(r){setDetail(r.data||m);setSelected(r.data||m);})
      .catch(function(e){setError(e.message);setDetail(m);})
      .finally(function(){setLoading(false);});
  }

  var selectMatch=function(m){
    setSelected(m);setDetail(m);setTab('scorecard');
    loadDetail(m);
  };

  var shareView=function(){
    if(!selected){setToast('Select a match');setTimeout(function(){setToast(null);},2000);return;}
    var u=new URL(location.href);u.searchParams.set('view','1');u.searchParams.set('match',selected.id);
    var link=u.toString();
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(link).then(function(){setToast('Link copied');setTimeout(function(){setToast(null);},2000);});
    }else{setModalVal(link);setModal('share');}
  };

  function triggerAd(){
    if(!ads.enabled||adShow)return;
    var item=(ads.items||[])[0];
    if(!item||(!item.image&&!item.text))return;
    setAdShow(item);
    setTimeout(function(){setAdShow(null);},(item.duration||4)*1000);
  }

  var d=detail||selected;
  var homeName=d?teamName(d,'local'):'—';
  var awayName=d?teamName(d,'visitor'):'—';
  var sc=d?scoreLine(d):{a:'—',b:'—'};
  var status=d?(d.status||d.note||''):'';
  var venue=d&&d.venue?d.venue.name:'';
  var league=d?(d.league&&d.league.name)||d.type||d.round||'':'';
  var st=d?statusOf(d):'';

  var filtered=matches.filter(function(m){
    if(filter==='all')return true;
    return statusOf(m)===filter;
  });

  var tabs=[['matches','Matches'],['schedule','Schedule'],['scorecard','Scorecard'],['batting','Batting'],['bowling','Bowling'],['info','Info']];

  return h('div',{className:'app'},
    error?h('div',{className:'error-bar'},error):null,

    // SCOREBOARD — content only (no MCS logo)
    h('div',{className:'broadcast'},
      bgUrl?h('div',{className:'bg-layer',style:{backgroundImage:'url('+bgUrl+')'}}):null,
      h('div',{className:'bg-overlay',style:{opacity:bgUrl?bgOp:0.92}}),
      h('div',{className:'bc-content'},
        h('div',{className:'bar'},
          viewOnly?h('span',{className:'view-badge'},'VIEW ONLY'):
            (selected?(st==='live'?h('span',{className:'live-pill'},h('i'),'LIVE'):h('span',{className:'done-pill'},st==='finished'?'FINISHED':'UPCOMING')):h('span',{className:'done-pill'},'CRICKET')),
          h('div',{style:{display:'flex',gap:8}},
            !viewOnly?h('button',{className:'icon-btn',onClick:shareView},'↗'):null,
            h('button',{className:'icon-btn',onClick:function(){loadList(true);}},loading?'…':'↻'),
            !viewOnly?h('button',{className:'icon-btn',onClick:function(){setSettingsOpen(!settingsOpen);}},'⚙'):null
          )
        ),
        selected?h(React.Fragment,null,
          h('div',{className:'match-header'},
            h('div',{className:'title'},league||'Match'),
            h('div',{className:'sub'},venue),
            h('div',{className:'status-line'},status||(d.note||''))
          ),
          h('div',{className:'score-grid'},
            h('div',{className:'side side-left'},
              h('div',{className:'tname'},h('span',null,shortName(homeName))),
              h('div',{className:'score-num'},String(sc.a).split(' ')[0]),
              h('div',{className:'overs'},sc.a.indexOf('(')>=0?sc.a.slice(sc.a.indexOf('(')):'' )
            ),
            h('div',{className:'match-center'},h('div',{className:'vs-label'},'VS')),
            h('div',{className:'side side-right'},
              h('div',{className:'tname'},h('span',null,shortName(awayName))),
              h('div',{className:'score-num'},String(sc.b).split(' ')[0]),
              h('div',{className:'overs'},sc.b.indexOf('(')>=0?sc.b.slice(sc.b.indexOf('(')):'' )
            )
          ),
          h('div',{className:'meta-row'},
            d.starting_at?h('span',null,fmtWhen(d.starting_at)):null,
            d.type?h('span',null,d.type):null
          )
        ):h('div',{className:'match-header'},
          h('div',{className:'title'},'Cricket Live'),
          h('div',{className:'sub'},token?'Pick a match below':'Add token in ⚙ Settings')
        )
      )
    ),

    !viewOnly&&settingsOpen?h(React.Fragment,null,
      h('div',{className:'settings-backdrop',onClick:function(){setSettingsOpen(false);}}),
      h('div',{className:'settings-dd'},
        h('div',{className:'dd-title'},'API'),
        h('button',{onClick:function(){setModalVal(token);setModal('token');setSettingsOpen(false);}},token?'Change token':'Add Sportmonks token'),
        h('div',{className:'dd-title'},'Theme'),
        THEMES.map(function(t){return h('button',{key:t,className:theme===t?'on':'',onClick:function(){setTheme(t);lsSet('cric_theme',t);}},t.charAt(0).toUpperCase()+t.slice(1));}),
        h('div',{className:'dd-title'},'Scoreboard background'),
        h('button',{onClick:function(){setModal('bgpanel');setSettingsOpen(false);}},'Image & opacity'),
        h('div',{className:'dd-title'},'Admin'),
        h('button',{onClick:function(){setAdminAds(true);setSettingsOpen(false);}},'Sponsor ads'),
        h('button',{onClick:shareView},'Copy view-only link'),
        h('button',{onClick:function(){cacheClear();setSettingsOpen(false);loadList(true);}},'Clear cache & refresh')
      )
    ):null,

    modal==='bgpanel'?h('div',{className:'modal-scrim',onClick:function(){setModal(null);}},
      h('div',{className:'modal-card',onClick:function(e){e.stopPropagation();}},
        h('h2',null,'Scoreboard background'),
        h('div',{className:'field'},
          h('label',null,'Image URL'),
          h('input',{type:'url',value:bgUrl,onChange:function(e){setBgUrl(e.target.value);lsSet('bg_cricket',e.target.value);}}),
          h('div',{className:'opacity-row'},
            h('span',{style:{fontSize:11,fontWeight:700,minWidth:70}},Math.round(bgOp*100)+'%'),
            h('input',{type:'range',min:0.2,max:0.95,step:0.05,value:bgOp,onChange:function(e){var v=parseFloat(e.target.value);setBgOp(v);lsSet('op_cricket',String(v));}})
          )
        ),
        h('div',{className:'actions'},
          h('button',{className:'btn',onClick:function(){setBgUrl(DEFAULT_BG);setBgOp(0.55);lsSet('bg_cricket',DEFAULT_BG);lsSet('op_cricket','0.55');}},'Reset'),
          h('button',{className:'btn primary',onClick:function(){setModal(null);}},'Done')
        )
      )
    ):null,

    modal&&modal!=='bgpanel'?h('div',{className:'modal-scrim',onClick:function(){setModal(null);}},
      h('div',{className:'modal-card',onClick:function(e){e.stopPropagation();}},
        h('h2',null,modal==='token'?'Sportmonks token':'Share'),
        h('div',{className:'hint'},modal==='token'?h(React.Fragment,null,'From ',h('a',{href:'https://my.sportmonks.com',target:'_blank',rel:'noreferrer'},'my.sportmonks.com'),'. Free plan: limited leagues.'):'View-only link'),
        h('div',{className:'field'},h('label',null,modal==='token'?'Token':'Link'),
          h('input',{type:modal==='token'?'password':'text',value:modalVal,readOnly:modal==='share',onChange:function(e){setModalVal(e.target.value);}})),
        h('div',{className:'actions'},
          h('button',{className:'btn',onClick:function(){setModal(null);}},'Cancel'),
          h('button',{className:'btn primary',onClick:function(){
            if(modal==='share'){if(navigator.clipboard)navigator.clipboard.writeText(modalVal);setModal(null);return;}
            var v=String(modalVal||'').trim();if(!v)return;lsSet('sportmonks_token',v);setToken(v);setModal(null);setToast('Saved');setTimeout(function(){setToast(null);},2000);
          }},modal==='share'?'Copy':'Save')
        )
      )
    ):null,

    !viewOnly&&adminAds?h('div',{className:'modal-scrim',onClick:function(){setAdminAds(false);}},
      h('div',{className:'modal-card',onClick:function(e){e.stopPropagation();}},
        h('h2',null,'Sponsor ads'),
        h('label',{style:{display:'flex',gap:8,fontWeight:700,marginBottom:12}},
          h('input',{type:'checkbox',checked:!!ads.enabled,onChange:function(e){var n=Object.assign({},ads,{enabled:e.target.checked});setAds(n);lsJSONSet('cric_ads_v1',n);}}),' Enabled'
        ),
        (ads.items||[]).map(function(item,idx){
          return h('div',{key:idx,className:'card'},
            h('div',{className:'field'},h('label',null,'Image'),h('input',{value:item.image||'',onChange:function(e){var items=ads.items.slice();items[idx]=Object.assign({},item,{image:e.target.value});var n=Object.assign({},ads,{items:items});setAds(n);lsJSONSet('cric_ads_v1',n);}})),
            h('div',{className:'field'},h('label',null,'Text'),h('input',{value:item.text||'',onChange:function(e){var items=ads.items.slice();items[idx]=Object.assign({},item,{text:e.target.value});var n=Object.assign({},ads,{items:items});setAds(n);lsJSONSet('cric_ads_v1',n);}})),
            h('button',{className:'btn',onClick:triggerAd},'Test')
          );
        }),
        h('button',{className:'btn primary',style:{width:'100%'},onClick:function(){setAdminAds(false);}},'Done')
      )
    ):null,

    adShow?h('div',{className:'ad-overlay',onClick:function(){setAdShow(null);}},
      h('div',{className:'ad-card',onClick:function(e){e.stopPropagation();}},
        h('button',{className:'ad-close',onClick:function(){setAdShow(null);}},'×'),
        adShow.image?h('img',{src:adShow.image,alt:''}):null,
        adShow.text?h('div',{style:{fontWeight:800,marginTop:8}},adShow.text):null
      )
    ):null,
    toast?h('div',{className:'toast'},toast):null,

    h('div',{className:'tabs'},
      tabs.map(function(p){
        return h('button',{key:p[0],className:tab===p[0]?'on':'',onClick:function(){
          setTab(p[0]);
          if((p[0]==='scorecard'||p[0]==='batting'||p[0]==='bowling'||p[0]==='info')&&selected)loadDetail(selected);
        }},p[1]);
      })
    ),

    h('div',{className:'panel'},
      // MATCHES
      tab==='matches'?h(React.Fragment,null,
        h('div',{className:'filter-row'},
          [['all','All'],['live','Live'],['upcoming','Upcoming'],['finished','Finished']].map(function(f){
            return h('button',{key:f[0],className:filter===f[0]?'on':'',onClick:function(){setFilter(f[0]);}},f[1]);
          })
        ),
        !token?h('div',{className:'empty'},'⚙ → Add Sportmonks token'):null,
        loading&&!matches.length?h('div',{className:'empty'},h('span',{className:'spinner'}),' Loading…'):null,
        !loading&&token&&!filtered.length?h('div',{className:'empty'},'No matches in this filter. Free plan covers limited leagues (T20I, BBL, CSA T20).'):null,
        h('div',{className:'match-list'},
          filtered.map(function(m){
            var hn=teamName(m,'local'),an=teamName(m,'visitor');
            var s=scoreLine(m);var st2=statusOf(m);
            var lg=(m.league&&m.league.name)||m.type||'';
            return h('div',{key:m.id,className:'match-card'+(selected&&selected.id===m.id?' is-sel':'')+(st2==='live'?' is-live':''),onClick:function(){selectMatch(m);}},
              h('div',{className:'mc-top'},
                st2==='live'?h('span',{className:'mc-live'},'LIVE'):st2==='finished'?h('span',{className:'mc-fin'},'FINISHED'):h('span',{className:'mc-up'},'UPCOMING'),
                h('span',{className:'mc-meta'},lg)
              ),
              h('div',{className:'mc-teams'},hn+' vs '+an),
              h('div',{className:'mc-scores'},s.a+'  —  '+s.b),
              h('div',{className:'mc-meta'},(m.status||'')+(m.starting_at?' · '+fmtWhen(m.starting_at):''))
            );
          })
        )
      ):null,

      // SCHEDULE
      tab==='schedule'?h(React.Fragment,null,
        h('div',{className:'card'},
          h('h3',null,'Schedule'),
          h('div',{className:'muted',style:{marginBottom:8}},'Upcoming & recent fixtures (plan leagues only)'),
          !matches.length?h('div',{className:'muted'},loading?'Loading…':'No fixtures loaded. Pull refresh ↻'):null,
          matches.slice().sort(function(a,b){return String(a.starting_at||'').localeCompare(String(b.starting_at||''));}).map(function(m){
            var st2=statusOf(m);
            return h('div',{key:m.id,style:{padding:'10px 0',borderBottom:'1px solid var(--line)',cursor:'pointer'},onClick:function(){selectMatch(m);}},
              h('div',{style:{fontWeight:800,fontSize:13}},teamName(m,'local')+' vs '+teamName(m,'visitor')),
              h('div',{className:'muted'},fmtWhen(m.starting_at)+' · '+(m.status||st2)+' · '+((m.league&&m.league.name)||m.type||''))
            );
          })
        )
      ):null,

      // SCORECARD
      tab==='scorecard'?(!selected?h('div',{className:'empty'},'Select a match'):h(React.Fragment,null,
        h('div',{className:'card'},
          h('h3',null,'Score'),
          h('div',{style:{fontSize:22,fontWeight:900,textAlign:'center'}},sc.a+'  —  '+sc.b),
          h('div',{className:'muted',style:{textAlign:'center',marginTop:6}},status||'—'),
          d&&d.note?h('div',{className:'muted',style:{textAlign:'center',marginTop:4}},d.note):null
        ),
        h('div',{className:'btn-row'},
          h('button',{className:'btn',onClick:function(){loadDetail(selected);}},'Refresh details')
        ),
        (d&&d.scoreboards&&d.scoreboards.length)?h('div',{className:'card'},
          h('h3',null,'Innings boards'),
          h('table',{className:'table'},
            h('thead',null,h('tr',null,h('th',null,'Board'),h('th',null,'Total'),h('th',null,'W'),h('th',null,'Overs'))),
            h('tbody',null,d.scoreboards.map(function(s,i){
              return h('tr',{key:i},
                h('td',null,s.scoreboard||s.type||'—'),
                h('td',null,s.total!=null?s.total:(s.score!=null?s.score:'—')),
                h('td',null,s.wickets!=null?s.wickets:'—'),
                h('td',null,s.overs!=null?s.overs:'—')
              );
            }))
          )
        ):h('div',{className:'card'},h('div',{className:'muted'},'Scoreboards load when available for finished or live matches on your plan.'))
      )):null,

      // BATTING
      tab==='batting'?(!selected?h('div',{className:'empty'},'Select a match'):h('div',{className:'card'},
        h('h3',null,'Batting'),
        (d&&d.batting&&d.batting.length)?h('table',{className:'table'},
          h('thead',null,h('tr',null,h('th',null,'Player'),h('th',null,'R'),h('th',null,'B'),h('th',null,'4s'),h('th',null,'6s'))),
          h('tbody',null,d.batting.slice(0,40).map(function(b,i){
            return h('tr',{key:i},
              h('td',null,b.player_name||(b.player&&b.player.fullnamename)||'—'),
              h('td',null,b.score!=null?b.score:(b.runs!=null?b.runs:'—')),
              h('td',null,b.ball!=null?b.ball:'—'),
              h('td',null,b.four_x!=null?b.four_x:'—'),
              h('td',null,b.six_x!=null?b.six_x:'—')
            );
          }))
        ):h('div',{className:'muted'},loading?'Loading…':'Batting card not available yet (or not in plan). Finished matches often include this after refresh.')
      )):null,

      // BOWLING
      tab==='bowling'?(!selected?h('div',{className:'empty'},'Select a match'):h('div',{className:'card'},
        h('h3',null,'Bowling'),
        (d&&d.bowling&&d.bowling.length)?h('table',{className:'table'},
          h('thead',null,h('tr',null,h('th',null,'Player'),h('th',null,'O'),h('th',null,'R'),h('th',null,'W'))),
          h('tbody',null,d.bowling.slice(0,40).map(function(b,i){
            return h('tr',{key:i},
              h('td',null,b.player_name||(b.player&&b.player.fullnamename)||'—'),
              h('td',null,b.overs!=null?b.overs:'—'),
              h('td',null,b.runs!=null?b.runs:'—'),
              h('td',null,b.wickets!=null?b.wickets:'—')
            );
          }))
        ):h('div',{className:'muted'},loading?'Loading…':'Bowling figures not available yet (or not in plan).')
      )):null,

      // INFO
      tab==='info'?(!selected?h('div',{className:'empty'},'Select a match'):h('div',{className:'card'},
        h('h3',null,'Match info'),
        h('div',{className:'kv'},
          h('div',{className:'item'},h('div',{className:'k'},'Home'),h('div',{className:'v'},homeName)),
          h('div',{className:'item'},h('div',{className:'k'},'Away'),h('div',{className:'v'},awayName)),
          h('div',{className:'item'},h('div',{className:'k'},'League'),h('div',{className:'v'},league||'—')),
          h('div',{className:'item'},h('div',{className:'k'},'Venue'),h('div',{className:'v'},venue||'—')),
          h('div',{className:'item'},h('div',{className:'k'},'Status'),h('div',{className:'v'},status||st||'—')),
          h('div',{className:'item'},h('div',{className:'k'},'Start'),h('div',{className:'v'},fmtWhen(d&&d.starting_at)||'—'))
        ),
        (d&&d.lineup&&d.lineup.length)?h(React.Fragment,null,
          h('h3',{style:{marginTop:14}},'Squad / lineup'),
          d.lineup.slice(0,30).map(function(p,i){
            return h('div',{key:i,style:{padding:'6px 0',borderBottom:'1px solid var(--line)',fontSize:13,fontWeight:600}},
              p.fullnamename||(p.player&&p.player.fullnamename)||'Player');
          })
        ):null
      )):null
    ),

    h('div',{className:'footer'},'MyCricStats · Cricket')
  );
}

var root=document.getElementById('root');
if(ReactDOM.createRoot)ReactDOM.createRoot(root).render(h(App));
else ReactDOM.render(h(App),root);
})();
</script>
</body>
</html>
