<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111e"><title>MyCricStats Live Viewer</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf2f7;color:#172333;font:15px system-ui,Arial,sans-serif}.top{background:#07111e;color:#fff;padding:18px 16px;font-weight:900;letter-spacing:1px}.wrap{max-width:760px;margin:auto;padding:14px}.score{background:linear-gradient(145deg,#14283a,#07111e);color:#fff;border:1px solid #26394c;border-radius:20px;padding:20px;box-shadow:0 12px 28px #14283a22}.muted{color:#b8c7d5}.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.team{background:#0c1724;border:1px solid #26394c;border-radius:14px;padding:14px;text-align:center}.big{text-align:center;font-size:54px;font-weight:900;line-height:1.1}.meta{text-align:center;color:#c5d1dc;font-weight:700}.target{text-align:center;color:#ffc857;font-weight:900;margin:10px}.players{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.player{background:#0c1724;border:1px solid #26394c;border-radius:14px;padding:14px}.panel{background:#fff;border-radius:16px;padding:15px;margin-top:14px;box-shadow:0 4px 16px #14283a10}.panel h3{margin:0 0 12px;font-size:13px;letter-spacing:.7px}.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #e8edf2;gap:10px}.ad{display:flex;align-items:center;gap:12px}.ad img{max-width:110px;max-height:65px;object-fit:contain}.ad a{color:#126b9b;text-decoration:none;font-weight:800}.status{padding:10px;color:#9b3030;text-align:center}.popup{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:20px;z-index:10}.popupbox{max-width:420px;width:100%;background:white;color:#172333;border-radius:18px;padding:18px;box-shadow:0 20px 60px #0006}.popupbox button{float:right;border:0;border-radius:20px;padding:8px 13px;background:#14283a;color:#fff}.popupbox img{display:block;max-width:100%;max-height:190px;object-fit:contain;margin:10px auto}@media(max-width:420px){.big{font-size:44px}.players{grid-template-columns:1fr}}
</style></head>
<body><header class="top">MYCRICSTATS · LIVE MATCH CENTRE</header><main class="wrap"><section class="panel" id="topSponsors" hidden><h3>OFFICIAL PARTNERS</h3><div id="sponsorsTop"></div></section><div id="status" class="status">Loading live match…</div><section class="score" id="score" hidden>
<div class="muted" id="title">MATCH CENTRE</div><div class="teams"><div class="team"><div id="teamA">🏏 Team A</div><div id="scoreA" class="big" style="font-size:30px">—</div><div id="oversA" class="muted"></div></div><div class="team"><div id="teamB">🏏 Team B</div><div id="scoreB" class="big" style="font-size:30px">Yet to bat</div><div id="oversB" class="muted"></div></div></div>
<div class="big" id="total">0/0</div><div class="meta" id="meta">0.0 OV · CRR 0.00 · EXTRAS 0</div><div class="target" id="target"></div>
<div class="players"><div class="player"><b>STRIKER</b><div id="striker">—</div><div id="strikerStats" class="muted"></div></div><div class="player"><b>BOWLER</b><div id="bowler">—</div><div id="bowlerStats" class="muted"></div></div></div><div class="muted" style="margin-top:14px">NON-STRIKER · <span id="nonStriker">—</span></div>
</section><section class="panel" id="sponsorPanel" hidden><h3>OFFICIAL SPONSORS</h3><div id="sponsors"></div></section><section class="panel" id="adsPanel" hidden><h3>ADVERTISEMENT</h3><div id="ads"></div></section><section class="panel" id="bottomSponsors" hidden><h3>SPONSORS</h3><div id="sponsorsBottom"></div></section><section class="panel"><h3>LIVE STATUS</h3><div id="updated" class="muted">Waiting for first update</div></section></main><div id="popup" class="popup" hidden><div class="popupbox"><button id="closePopup">Close ✕</button><h3 id="popupTitle">Advertisement</h3><div id="popupContent"></div></div></div>
<script>
const id=new URLSearchParams(location.search).get('id');const el=x=>document.getElementById(x);let shownAds=new Set(),popupIndex=0;el('closePopup').onclick=()=>el('popup').hidden=true;
const safeUrl=v=>{try{const u=new URL(v,location.href);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}};
function showList(root,items){root.replaceChildren();for(const x of (items||[]).slice(0,10)){const box=document.createElement('div');box.className='row ad';if(x.image&&safeUrl(x.image)){const img=document.createElement('img');img.src=safeUrl(x.image);img.alt=x.name||'Sponsor';box.append(img)}const label=document.createElement('span');label.textContent=x.name||'Sponsor';const href=safeUrl(x.link);if(href){const a=document.createElement('a');a.href=href;a.target='_blank';a.rel='noopener';a.textContent=label.textContent;box.append(a)}else box.append(label);root.append(box)}}
async function load(){if(!id){el('status').textContent='Missing live match ID in URL.';return}try{const r=await fetch('/api/live/'+encodeURIComponent(id),{cache:'no-store'});if(!r.ok)throw new Error('Live data unavailable (HTTP '+r.status+').');const payload=await r.json();const state=payload.state||{},m=state.match||{},innings=m.inningsList||[],inn=innings[Math.max(0,innings.length-1)]||{},first=innings[0]||{},a=state.teamA||{},b=state.teamB||{},players=state.players||[];const byName=n=>players.find(p=>p.name===n)||{};const fmt=x=>(x?.runs??0)+'/'+(x?.wickets??0);el('title').textContent=m.settings?.title||'MATCH CENTRE';el('teamA').textContent=(a.flag||'🏏')+' '+(a.name||m.teamA||'Team A');el('teamB').textContent=(b.flag||'🏏')+' '+(b.name||m.teamB||'Team B');const battingFirst=m.firstBattingTeamId===m.teamAId,breakNow=m.status==='Innings Break',firstTeamInnings=first,secondTeamInnings=breakNow?null:inn;const scoreForA=battingFirst?firstTeamInnings:secondTeamInnings,scoreForB=battingFirst?secondTeamInnings:firstTeamInnings;el('scoreA').textContent=scoreForA?fmt(scoreForA):'Yet to bat';el('scoreB').textContent=scoreForB?fmt(scoreForB):'Yet to bat';el('oversA').textContent=scoreForA?'('+Math.floor((scoreForA.legalBalls||0)/6)+'.'+((scoreForA.legalBalls||0)%6)+' overs)':'Batting next';el('oversB').textContent=scoreForB?'('+Math.floor((scoreForB.legalBalls||0)/6)+'.'+((scoreForB.legalBalls||0)%6)+' overs)':'Batting next';const display=breakNow?first:inn;el('total').textContent=fmt(display);el('meta').textContent=(display.legalBalls?Math.floor(display.legalBalls/6)+'.'+(display.legalBalls%6):'0.0')+' OV · CRR '+(display.legalBalls?(display.runs/(display.legalBalls/6)).toFixed(2):'0.00')+' · EXTRAS '+(display.extras||0);el('target').textContent=inn.target?'TARGET '+inn.target+' · NEED '+Math.max(0,inn.target-(inn.runs||0))+' RUNS':'';const st=byName(inn.striker),bw=byName(inn.bowler);el('striker').textContent=st.name||'Not selected';el('strikerStats').textContent=(st.runs||0)+' ('+(st.balls||0)+') · 4s '+(st.fours||0)+' · 6s '+(st.sixes||0);el('bowler').textContent=bw.name||'Not selected';el('bowlerStats').textContent=(bw.bowlRuns||0)+' runs · '+(bw.wickets||0)+' wickets';el('nonStriker').textContent=byName(inn.nonStriker).name||'—';el('score').hidden=false;const sponsors=state.sponsors||[];el('sponsorPanel').hidden=!sponsors.length;el('topSponsors').hidden=!sponsors.length;el('bottomSponsors').hidden=!sponsors.length;showList(el('sponsors'),sponsors);showList(el('sponsorsTop'),sponsors);showList(el('sponsorsBottom'),sponsors);const ads=state.popupAds||[];el('adsPanel').hidden=!ads.length;showList(el('ads'),ads);if(ads.length&&!shownAds.has(id+':'+ads.length)){const ad=ads[popupIndex%ads.length];popupIndex++;shownAds.add(id+':'+ads.length);el('popupTitle').textContent=ad.name||'Advertisement';const content=el('popupContent');content.replaceChildren();if(ad.image&&safeUrl(ad.image)){const im=document.createElement('img');im.src=safeUrl(ad.image);im.alt=ad.name||'Advertisement';content.append(im)}if(ad.link&&safeUrl(ad.link)){const a=document.createElement('a');a.href=safeUrl(ad.link);a.target='_blank';a.rel='noopener';a.textContent='Visit sponsor';content.append(a)}el('popup').hidden=false;}el('status').textContent=m.status==='Completed'?'MATCH COMPLETED':m.status==='Innings Break'?'INNINGS BREAK':'● LIVE';el('updated').textContent='Last updated '+new Date(payload.updatedAt||Date.now()).toLocaleTimeString();}catch(e){el('status').textContent=e.message;}}
load();setInterval(load,5000);
</script></body></html>
