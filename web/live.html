<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08121f"><title>MyCricStats Live</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07111d;color:#f3f6f9;font:16px Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:16px}.brand{font-weight:900;letter-spacing:1.5px;color:#c6d4df;font-size:13px}.card{background:#101e2d;border:1px solid #263b4d;border-radius:8px;padding:18px;margin-top:14px}.teams{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#d6e1e9;font-weight:800}.score{text-align:center;font-size:64px;font-weight:900;letter-spacing:-2px;margin:14px 0 4px}.meta{text-align:center;color:#9fb3c3;font-size:13px}.target{text-align:center;color:#ffd166;font-weight:800;margin-top:10px}.section{font-weight:800;font-size:12px;letter-spacing:1px;color:#a8bdce;margin:20px 0 8px}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #263746}.row:last-child{border:0}.muted{color:#9fb3c3}.status{color:#ff6677;font-size:11px;font-weight:900}.err{color:#ffd166;text-align:center;padding:40px 10px}.refresh{color:#94a8b8;text-align:center;font-size:11px;margin:14px}.ad{display:block;margin:14px 0;padding:12px;background:#fff;color:#17212b;border-radius:12px;text-decoration:none}.ad img{display:block;width:100%;max-height:240px;object-fit:contain;border-radius:8px}.ad strong{display:block;margin:6px 0;font-size:12px;letter-spacing:1px}
 .section{margin:8px 0 12px;font-weight:900;letter-spacing:1px;color:#a8bdce;font-size:12px}\n</style></head><body><div class="wrap"><div class="brand">MYCRICSTATS <span class="status">● LIVE SCORE</span></div><div id="app" class="err">Loading live match…</div><div class="refresh" id="updated"></div></div>
<script>
const id=new URLSearchParams(location.search).get('id');const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){if(!id){app.textContent='No match ID was provided.';return}try{const r=await fetch('/api/live/'+encodeURIComponent(id),{cache:'no-store'});if(!r.ok)throw new Error(r.status===404?'Match not published yet':'Unable to load live match');const data=await r.json();const s=data.state||{},m=s.match||{},players=s.players||[],inns=m.inningsList||[],inn=inns[inns.length-1]||{},byId=Object.fromEntries(players.map(p=>[p.id,p]));const bat=m.innings===1?m.teamA:m.teamB;const teamA=s.teamA||{},teamB=s.teamB||{};const striker=byId[inn.striker]||{},non=byId[inn.nonStriker]||{},bowler=byId[inn.bowler]||{};const first=inns[0]||{};app.innerHTML='<div class="card"><div class="teams"><span>'+esc(teamA.flag||'🏏')+' '+esc(m.teamA||'Team A')+'</span><span>VS</span><span>'+esc(teamB.flag||'🏏')+' '+esc(m.teamB||'Team B')+'</span></div><div class="score">'+esc(inn.runs||0)+'/'+esc(inn.wickets||0)+'</div><div class="meta">'+esc(bat)+' · '+esc(inn.legalBalls?Math.floor(inn.legalBalls/6)+'.'+inn.legalBalls%6:'0.0')+' OV · CRR '+(inn.legalBalls?(inn.runs/(inn.legalBalls/6)).toFixed(2):'0.00')+' · EXTRAS '+esc(inn.extras||0)+'</div>'+(m.innings===2?'<div class="target">TARGET '+esc(inn.target||((first.runs||0)+1))+'</div>':'')+'</div><div class="card"><div class="section">BATTING</div><div class="row"><span>'+esc(striker.name||'Striker')+' *</span><b>'+esc(striker.runs||0)+' ('+esc(striker.balls||0)+')</b></div><div class="row"><span>'+esc(non.name||'Non-striker')+'</span><b>'+esc(non.runs||0)+' ('+esc(non.balls||0)+')</b></div><div class="section">BOWLING</div><div class="row"><span>'+esc(bowler.name||'Bowler')+'</span><b>'+esc(bowler.wickets||0)+'/'+esc(bowler.bowlRuns||0)+'</b></div></div><div class="card"><div class="section">RECENT BALLS</div><div>'+esc((inn.overBalls||[]).join(' · ')||'No deliveries yet')+'</div></div>';const cfg=m.settings||{};if(cfg.adEnabled&&(cfg.adText||cfg.adImageUrl)){const href=String(cfg.adLink||'').trim();const safeHref=/^https?:\\/\\//i.test(href)?href:'';const image=String(cfg.adImageUrl||'').trim();const safeImage=/^https?:\\/\\//i.test(image)?image:'';const ad=document.createElement('a');ad.className='ad';if(safeHref){ad.href=safeHref;ad.target='_blank';ad.rel='noopener noreferrer';}else{ad.removeAttribute('href');}ad.innerHTML='<strong>ADVERTISEMENT</strong>'+(safeImage?'<img src="'+esc(safeImage)+'" alt="Sponsor advertisement">':'')+(cfg.adText?'<div>'+esc(cfg.adText)+'</div>':'');app.appendChild(ad);}
const sponsorList=Array.isArray(s.sponsors)?s.sponsors:[];
const adList=Array.isArray(s.popupAds)?s.popupAds:[];
const tournament=s.tournament||{};
if(sponsorList.length){const box=document.createElement('section');box.className='card';box.innerHTML='<div class="section">OFFICIAL SPONSORS</div>';sponsorList.slice(0,10).forEach(x=>{const a=document.createElement('a');a.className='row';a.style.alignItems='center';a.style.gap='12px';a.style.textDecoration='none';a.style.color='inherit';const href=String(x.link||'').trim();if(/^https?:\\/\\//i.test(href)){a.href=href;a.target='_blank';a.rel='noopener noreferrer';}if(x.image&&/^https?:\\/\\//i.test(x.image)){const im=document.createElement('img');im.src=x.image;im.alt=esc(x.name||'Sponsor');im.style.cssText='width:64px;height:54px;object-fit:contain;background:#fff;border-radius:6px;padding:4px';a.appendChild(im);}const name=document.createElement('strong');name.textContent=x.name||'Sponsor';a.appendChild(name);box.appendChild(a);});app.appendChild(box);}
if(Array.isArray(tournament.fixtures)&&tournament.fixtures.length){const box=document.createElement('section');box.className='card';const h=document.createElement('div');h.className='section';h.textContent=tournament.name||'TOURNAMENT SCHEDULE';box.appendChild(h);tournament.fixtures.forEach(f=>{const row=document.createElement('div');row.className='row';const left=document.createElement('strong');left.textContent=(f.teamAName||'Team A')+' vs '+(f.teamBName||'Team B');const right=document.createElement('span');right.className='muted';right.textContent=(f.type||'Match')+' · '+(f.date||'TBC');row.append(left,right);box.appendChild(row);});app.appendChild(box);}
if(cfg.adEnabled&&adList.length){const ad=adList[0];const overlay=document.createElement('div');overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';const card=document.createElement('div');card.style.cssText='background:#fff;color:#14202b;border-radius:18px;padding:22px;max-width:520px;width:100%;position:relative;text-align:center;box-shadow:0 18px 55px rgba(0,0,0,.35)';const close=document.createElement('button');close.textContent='Close ✕';close.style.cssText='border:0;border-radius:24px;padding:10px 18px;background:#152a3d;color:#fff;font-size:14px;float:right';close.onclick=()=>overlay.remove();card.appendChild(close);const h=document.createElement('h3');h.textContent=ad.name||'Advertisement';h.style.cssText='clear:both;padding-top:18px';card.appendChild(h);if(ad.image&&/^https?:\\/\\//i.test(ad.image)){const im=document.createElement('img');im.src=ad.image;im.alt=ad.name||'Advertisement';im.style.cssText='max-width:100%;max-height:260px;object-fit:contain;margin:8px auto';card.appendChild(im);}if(ad.text){const p=document.createElement('p');p.textContent=ad.text;card.appendChild(p);}if(ad.link&&/^https?:\\/\\//i.test(ad.link)){const a=document.createElement('a');a.href=ad.link;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Learn more';card.appendChild(a);}overlay.appendChild(card);document.body.appendChild(overlay);}
document.getElementById('updated').textContent='Updated '+new Date(data.updatedAt).toLocaleTimeString()+' · Auto-refresh every 3 seconds';}catch(e){app.textContent=e.message;app.className='err'}}
load();setInterval(load,3000);
</script></body></html>
