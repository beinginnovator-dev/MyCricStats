<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>MyCricStats</title>
<meta name="theme-color" content="#01002C"/>
<link rel="manifest" href="/manifest.webmanifest"/>
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"/>
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#01002C;--bg2:#0a0a3a;--card:#12123f;--line:rgba(255,255,255,.12);--text:#f8fafc;--muted:#a8a8c8;--red:#FF0F50;--gold:#fbbf24;--blue:#7dd3fc;--accent:#FF0F50;--ok:#22c55e}
body.theme-dark{--bg:#01002C;--bg2:#0a0a3a;--card:#12123f}
body.theme-light{--bg:#f4f4f8;--bg2:#fff;--card:#fff;--line:rgba(1,0,44,.12);--text:#01002C;--muted:#5c5c7a;--accent:#FF0F50;--blue:#0284c7;--gold:#b45309}
body.theme-pitch{--bg:#062816;--bg2:#0c3d22;--card:#0f4a2a;--line:rgba(52,211,153,.2);--text:#ecfdf5;--muted:#6ee7b7;--accent:#10b981;--blue:#34d399}
body.theme-night{--bg:#0b1020;--bg2:#151b2e;--card:#1c2438}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Montserrat,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.app{max-width:480px;margin:0 auto;padding-bottom:32px;min-height:100vh}
.broadcast{position:relative;background:#01002C;border-bottom:1px solid var(--line);padding:0 0 12px;overflow:hidden;min-height:30vh;display:flex;flex-direction:column}
.broadcast .bg-layer{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
.broadcast .bg-overlay{position:absolute;inset:0;background:#01002C;z-index:1}
.broadcast .bc-content{position:relative;z-index:2;display:flex;flex-direction:column;flex:1}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px 4px;min-height:40px}
.bar .icon-btn{width:36px;height:36px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.35);color:#fff;font-size:15px;cursor:pointer;font-family:inherit}
.brand-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:900;color:#fff;letter-spacing:.06em}
.brand-chip img{width:24px;height:24px;border-radius:50%;animation:logoBreathe 2.8s ease-in-out infinite}
@keyframes logoBreathe{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(255,255,255,0))}50%{transform:scale(1.12);filter:drop-shadow(0 0 8px rgba(255,255,255,.55))}}
.bounce-ball{position:fixed;left:50%;bottom:18%;z-index:9001;width:48px;height:48px;margin-left:-24px;pointer-events:none;opacity:0}
.bounce-ball.show{opacity:1}
.bounce-ball img,.bounce-ball .ball-emoji{width:48px;height:48px;display:block;border-radius:50%}
.bounce-ball .run-stamp{position:absolute;left:50%;top:-8px;transform:translateX(-50%);font-weight:900;font-size:16px;color:#fff;text-shadow:0 2px 8px #000}
.bounce-ball.r1{animation:ballBounce1 1.1s ease-out forwards}
.bounce-ball.r2{animation:ballBounce2 1.25s ease-out forwards}
.bounce-ball.r3{animation:ballBounce3 1.35s ease-out forwards}
.bounce-ball.r4{animation:ballBounce4 1.5s ease-out forwards}
.bounce-ball.r6{animation:ballBounce6 1.7s ease-out forwards}
@keyframes ballBounce1{0%{transform:translateY(0) scale(1);opacity:1}40%{transform:translateY(-40px) scale(1.05)}70%{transform:translateY(-10px)}100%{transform:translateY(-60px);opacity:0}}
@keyframes ballBounce2{0%{transform:translateY(0);opacity:1}40%{transform:translateY(-70px) scale(1.08)}70%{transform:translateY(-20px)}100%{transform:translateY(-100px);opacity:0}}
@keyframes ballBounce3{0%{transform:translateY(0);opacity:1}40%{transform:translateY(-100px) scale(1.1)}70%{transform:translateY(-30px)}100%{transform:translateY(-130px);opacity:0}}
@keyframes ballBounce4{0%{transform:translateY(0);opacity:1}35%{transform:translateY(-130px) scale(1.12)}60%{transform:translateY(-40px)}100%{transform:translateY(-160px);opacity:0}}
@keyframes ballBounce6{0%{transform:translateY(0);opacity:1}30%{transform:translateY(-180px) scale(1.18)}55%{transform:translateY(-50px)}100%{transform:translateY(-220px);opacity:0}}
.news-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.news-thumb{width:88px;height:66px;border-radius:10px;object-fit:cover;background:rgba(127,127,127,.15);flex-shrink:0}
.news-body{min-width:0;flex:1}
.news-body .nt{font-weight:800;font-size:13px;line-height:1.35}
.news-body .nd{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.35}
.news-body .nm{font-size:11px;color:var(--muted);margin-top:4px}
.news-ticker{display:flex;gap:10px;align-items:center;padding:8px 4px;min-height:56px}
.news-ticker img{width:56px;height:42px;border-radius:8px;object-fit:cover;flex-shrink:0;background:rgba(0,0,0,.3)}
.news-ticker .nt-text{flex:1;min-width:0;overflow:hidden;height:40px;position:relative}
.news-ticker .nt-scroll{position:absolute;left:0;top:0;width:100%;animation:newsScroll 12s linear infinite}
.news-ticker .nt-title{font-size:12px;font-weight:800;color:#fde68a;line-height:1.3}
.news-ticker .nt-desc{font-size:11px;color:#e2e8f0;margin-top:2px;line-height:1.3}
@keyframes newsScroll{0%{transform:translateY(0);opacity:1}70%{transform:translateY(0);opacity:1}85%{transform:translateY(-50%);opacity:0}86%{transform:translateY(40%);opacity:0}100%{transform:translateY(0);opacity:1}}
.news-player{padding:6px 4px 4px}
.news-player .np-row{display:flex;gap:10px;align-items:flex-start}
.news-player .np-img{width:120px;height:96px;object-fit:cover;border-radius:10px;background:rgba(0,0,0,.25);flex-shrink:0}
.news-player .np-copy{flex:1;min-width:0}
.news-player .np-title{font-size:13px;font-weight:800;color:#fde68a;line-height:1.35}
.news-player .np-desc{font-size:12px;color:#e2e8f0;margin-top:4px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.news-player .np-meta{font-size:10px;color:#94a3b8;margin-top:4px}
.news-player .np-controls{display:flex;justify-content:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.news-player .np-controls button{min-width:40px;height:34px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.35);color:#fff;font-weight:800;font-size:12px;cursor:pointer;font-family:inherit;padding:0 12px}
.live-pair{grid-template-columns:1fr 1fr 1fr!important}


.inapp{position:fixed;inset:0;z-index:11000;background:var(--bg);display:flex;flex-direction:column}
.inapp-bar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--bg2);border-bottom:1px solid var(--line)}
.inapp-bar .title{flex:1;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inapp iframe{flex:1;width:100%;border:0;background:#fff}


.brand-wrap{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.tname img.flag{width:18px;height:12px;object-fit:cover;border-radius:2px;flex-shrink:0}
.live-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,15,80,.2);border:1px solid rgba(255,15,80,.5);color:#fecdd3;font-size:11px;font-weight:900;padding:4px 10px;border-radius:999px}
.live-pill i{width:7px;height:7px;border-radius:50%;background:#FF0F50;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.done-pill{font-size:10px;font-weight:800;color:#94a3b8;background:rgba(148,163,184,.15);padding:4px 10px;border-radius:999px}
.view-badge{font-size:10px;font-weight:800;background:rgba(255,15,80,.2);color:#F78DA7;padding:3px 8px;border-radius:999px}
.scoreboard-body{padding:4px 14px 8px;flex:1;display:flex;flex-direction:column;justify-content:center}
.match-header{text-align:center;padding:2px 4px}
.match-header .title{font-size:13px;font-weight:900;color:var(--gold);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.match-header .sub{font-size:11px;font-weight:700;color:#cbd5e1;margin-top:2px}
.match-header .status-line{font-size:12px;font-weight:700;color:#e2e8f0;margin-top:4px}
.score-grid{display:grid;grid-template-columns:1fr 40px 1fr;gap:4px;align-items:start;margin-top:8px}
.side{text-align:center;min-width:0;padding:0 6px;display:flex;flex-direction:column;align-items:center}
.tname{font-size:12px;font-weight:800;text-transform:uppercase;color:#f8fafc;display:flex;align-items:center;justify-content:center;gap:5px;width:100%;max-width:100%;margin-bottom:2px}
.tname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.side-left .tname,.side-right .tname{justify-content:center}
.score-num{font-size:26px;font-weight:900;line-height:1.1;margin:2px 0 0;color:#fff;font-variant-numeric:tabular-nums;text-align:center;width:100%}
.overs{font-size:13px;color:#cbd5e1;font-weight:700;margin-top:2px;text-align:center;width:100%}
.match-center .vs-label{font-size:11px;font-weight:900;letter-spacing:.12em;color:#94a3b8;text-align:center}
.meta-row{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:11px;color:#cbd5e1;font-weight:600}
.live-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.lp{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:8px 10px;text-align:left}
.lp .k{font-size:9px;font-weight:800;text-transform:uppercase;color:#94a3b8}
.lp .v{font-size:12px;font-weight:800;color:#fff;margin-top:2px}
.lp-sub{font-size:10px;font-weight:600;color:#cbd5e1;margin-top:2px;line-height:1.35}
.tabs{display:flex;gap:0;overflow-x:auto;background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.tabs button{flex:0 0 auto;border:0;background:transparent;color:var(--muted);font-family:inherit;font-weight:800;font-size:12px;padding:13px 12px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.panel{padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 10px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800}
.muted{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:rgba(127,127,127,.08);color:var(--text);border-radius:999px;padding:8px 14px;font-weight:800;font-size:12px;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.filter-row{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.filter-row button{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--muted);font-family:inherit;font-weight:800;font-size:11px;padding:7px 12px;border-radius:999px;cursor:pointer}
.filter-row button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.match-list{display:flex;flex-direction:column;gap:8px}
.match-card{padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer}
body.theme-light .match-card{background:#fff}
.match-card.is-live{border-color:rgba(255,15,80,.45)}
.match-card.is-sel{border-color:rgba(255,15,80,.6);background:rgba(255,15,80,.08)}
.mc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.mc-live{font-size:10px;font-weight:900;color:#fecdd3;background:rgba(255,15,80,.25);padding:2px 8px;border-radius:999px}
.mc-fin{font-size:10px;font-weight:800;color:#94a3b8;background:rgba(148,163,184,.15);padding:2px 8px;border-radius:999px}
.mc-up{font-size:10px;font-weight:800;color:#7dd3fc;background:rgba(56,189,248,.15);padding:2px 8px;border-radius:999px}
.mc-meta{font-size:11px;color:var(--muted)}
.mc-teams{font-size:14px;font-weight:800;margin:2px 0}
.mc-scores{font-size:16px;font-weight:900;margin:4px 0;color:var(--blue)}
.table{width:100%;border-collapse:collapse;font-size:12px}
.table th{text-align:left;color:var(--muted);font-weight:800;padding:6px 4px;border-bottom:1px solid var(--line);font-size:10px;text-transform:uppercase}
.table td{padding:7px 4px;border-bottom:1px solid var(--line);font-weight:600}
.empty{text-align:center;padding:36px 16px;color:var(--muted);font-size:14px}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(127,127,127,.3);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.error-bar{background:#3b0715;color:#fecaca;font-size:13px;padding:10px 14px;text-align:center;font-weight:600;line-height:1.4}
body.theme-light .error-bar{background:#fef2f2;color:#991b1b}
.footer{text-align:center;padding:16px;font-size:11px;color:var(--muted)}
.settings-dd{position:fixed;right:10px;top:48px;z-index:9999;background:var(--bg2);border:1px solid var(--line);border-radius:14px;min-width:280px;max-width:92vw;max-height:80vh;overflow:auto;padding:8px;box-shadow:0 16px 40px rgba(0,0,0,.5)}
.settings-dd .dd-title{font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 12px}
.settings-dd button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--text);font-weight:700;font-size:13px;padding:11px 12px;border-radius:10px;cursor:pointer;font-family:inherit}
.settings-dd button:hover,.settings-dd button.on{background:rgba(255,15,80,.15)}
.settings-backdrop{position:fixed;inset:0;z-index:9998}
.modal-scrim{position:fixed;inset:0;z-index:10050;background:rgba(1,0,44,.75);display:flex;align-items:center;justify-content:center;padding:16px}
.modal-card{width:min(420px,94vw);background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:18px;color:var(--text);max-height:90vh;overflow:auto}
.modal-card h2{font-size:16px;font-weight:900;margin:0 0 6px}
.modal-card .hint{font-size:12px;color:var(--muted);line-height:1.45;margin-bottom:12px}
.modal-card .hint a{color:var(--blue)}
.modal-card .field{margin-bottom:12px}
.modal-card .field label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.modal-card .field input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-family:inherit;font-size:14px;font-weight:600}
.modal-card .actions{display:flex;gap:8px;margin-top:14px}
.modal-card .actions .btn{flex:1;padding:12px;border-radius:12px}
.opacity-row{display:flex;align-items:center;gap:10px;margin-top:8px}
.opacity-row input[type=range]{flex:1}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv .item{background:rgba(127,127,127,.06);border:1px solid var(--line);border-radius:12px;padding:10px}
.kv .item .k{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase}
.kv .item .v{font-size:13px;font-weight:800;margin-top:4px;word-break:break-word}
.ad-overlay{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;background:rgba(1,0,44,.6);padding:16px}
.ad-card{background:#0a0a3a;color:#fff;border-radius:16px;padding:14px;max-width:360px;width:100%;position:relative;text-align:center;border:1px solid rgba(255,15,80,.3)}
.ad-card img{max-width:100%;max-height:220px;border-radius:10px;margin:8px auto;display:block}
.ad-close{position:absolute;top:8px;right:10px;border:0;background:rgba(127,127,127,.3);color:inherit;width:28px;height:28px;border-radius:50%;cursor:pointer;font-weight:900}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:10001;background:#166534;color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700}
.ev-banner{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:9000;min-width:160px;padding:14px 22px;border-radius:14px;font-weight:900;font-size:18px;text-align:center;color:#fff;box-shadow:0 12px 32px rgba(0,0,0,.5);pointer-events:none;opacity:0}
.ev-banner.show{animation:evpop 2.4s ease-out forwards}
.ev-banner.runs{background:linear-gradient(135deg,#2563eb,#3b82f6)}
.ev-banner.four{background:linear-gradient(135deg,#16a34a,#22c55e)}
.ev-banner.six{background:linear-gradient(135deg,#7c3aed,#a855f7)}
.ev-banner.dot{background:linear-gradient(135deg,#475569,#64748b)}
.ev-banner.extra{background:linear-gradient(135deg,#6d28d9,#a855f7)}
.ev-banner.wicket{background:linear-gradient(135deg,#b91c1c,#ef4444)}
@keyframes evpop{0%{opacity:0;transform:translateX(-50%) scale(.85)}12%{opacity:1;transform:translateX(-50%) scale(1.08)}70%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0}}
.over-card{border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden;background:rgba(255,255,255,.03)}
.over-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:rgba(255,15,80,.08);border-bottom:1px solid var(--line);font-size:12px;font-weight:800}
.over-head .sum{color:var(--blue)}
.ball-row{display:flex;gap:6px;padding:10px 12px;flex-wrap:wrap;align-items:center}
.ball-chip{min-width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#fff;background:#475569}
.ball-chip.c0{background:#64748b}.ball-chip.c1{background:#2563eb}.ball-chip.c2{background:#0ea5e9}.ball-chip.c3{background:#0284c7}
.ball-chip.c4{background:#16a34a}.ball-chip.c6{background:#7c3aed}.ball-chip.cw{background:#e11d48}.ball-chip.cx{background:#9333ea}
.ball-detail{padding:8px 12px;border-top:1px solid var(--line);font-size:13px;line-height:1.45}
.ball-detail .ov{font-weight:800;color:var(--blue);margin-right:6px}
.ball-detail .hi{font-weight:900;color:#fbbf24}
.ball-detail .hi-w{font-weight:900;color:#fb7185}
.ball-detail .hi-b{font-weight:900;color:#4ade80}
.over-end{padding:10px 12px;background:rgba(56,189,248,.08);border-top:1px solid var(--line);font-size:12px;font-weight:700;color:var(--muted)}
.players-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pbox{background:rgba(127,127,127,.06);border:1px solid var(--line);border-radius:12px;padding:10px}
.pbox .k{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase}
.pbox .v{font-size:14px;font-weight:800;margin-top:2px}
body.theme-light .tabs,body.theme-light .settings-dd,body.theme-light .modal-card{background:#fff}
body.theme-light .settings-dd button{color:#01002C}
body.theme-light .broadcast .title,body.theme-light .broadcast .sub,body.theme-light .broadcast .status-line,
body.theme-light .broadcast .tname,body.theme-light .broadcast .score-num,body.theme-light .broadcast .overs,body.theme-light .broadcast .meta-row,body.theme-light .broadcast .vs-label,body.theme-light .lp .v{color:#f8fafc!important}
</style>
</head>
<body class="theme-dark">
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script>

if(!window.React){
  document.write('<script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"><\/script>');
  document.write('<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"><\/script>');
}
})();
</script>
<script>
(function(){
'use strict';
document.addEventListener('pointerdown',function once(){document.removeEventListener('pointerdown',once);try{unlockAudio();}catch(e){};},{once:true});
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('/sw.js').then(function(reg){
      try{if(reg.update)reg.update();}catch(e){}
    }).catch(function(){});
    // clear old caches once
    try{
      caches.keys().then(function(ks){ks.forEach(function(k){if(k.indexOf('mcs-')===0&&k!=='mcs-v8')caches.delete(k);});});
    }catch(e){}
  });

function batStats(b){
  if(!b)return{line1:'',line2:'',line3:''};
  var r=b.score!=null?b.score:(b.runs!=null?b.runs:0);
  var bl=b.ball!=null?b.ball:(b.balls!=null?b.balls:0);
  var f=b.four_x!=null?b.four_x:(b.fours!=null?b.fours:0);
  var s=b.six_x!=null?b.six_x:(b.sixes!=null?b.sixes:0);
  var sr=(bl>0)?((Number(r)/Number(bl))*100).toFixed(1):'—';
  return{line1:r+'('+bl+')',line2:'4s '+f+'  ·  6s '+s,line3:'Strike rate  '+sr};
}
function bowlStats(b){
  if(!b)return{line1:'',line2:''};
  var o=b.overs!=null?b.overs:'—';
  var r=b.runs!=null?b.runs:0;
  var w=b.wickets!=null?b.wickets:0;
  var balls=b.balls!=null?b.balls:null;
  var econ='—';
  if(o!=null&&o!=='—'&&Number(o)>0)econ=(Number(r)/Number(o)).toFixed(2);
  var line1=o+' ov · '+r+' runs · '+w+' wkts'+(balls!=null?(' · '+balls+'b'):'');
  return{line1:line1,line2:'Economy  '+econ};
}
function currentPlayers(d){
  if(!d)return{striker:'—',nonstriker:'—',bowler:'—',strikerStat:'',nonstrikerStat:'',bowlerStat:'',batTeam:'',bowlTeam:''};
  var batting=d.batting||[];
  var bowling=d.bowling||[];
  var notOut=batting.filter(function(b){
    if(b.active===true)return true;
    if(b.active===false)return false;
    return !b.out;
  });
  if(notOut.length<2)notOut=batting.slice(-2);
  var bowlSorted=bowling.slice().sort(function(a,b){
    var ao=Number(a.overs)||0,bo=Number(b.overs)||0;
    if(ao!==bo)return bo-ao;
    return (Number(b.wickets)||0)-(Number(a.wickets)||0);
  });
  var striker=notOut[0], non=notOut[1], bowler=bowlSorted[0];
  if(bowler&&striker){
    var sn=playerName(striker.batsman||striker);
    var bn=playerName(bowler.bowler||bowler);
    if(sn&&bn&&sn===bn&&bowlSorted[1])bowler=bowlSorted[1];
  }
  return{
    striker:playerName(striker&&(striker.batsman||striker))||'—',
    nonstriker:playerName(non&&(non.batsman||non))||'—',
    bowler:playerName(bowler&&(bowler.bowler||bowler))||'—',
    strikerS:batStats(striker),
    nonstrikerS:batStats(non),
    bowlerS:bowlStats(bowler),
    batTeam:'',
    bowlTeam:''
  };
}

function loadNewsRss(){
  function parse(j){
    var arr=Array.isArray(j&&j.data)?j.data:(Array.isArray(j)?j:[]);
    return arr;
  }
  return fetch('/api/news',{cache:'no-store'})
    .then(function(r){
      if(!r.ok)throw new Error('HTTP '+r.status);
      return r.json();
    })
    .then(parse)
    .catch(function(e1){
      // fallback: allorigins Google news RSS
      var q='https://news.google.com/rss/search?q=cricket&hl=en-IN&gl=IN&ceid=IN:en';
      return fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(q))
        .then(function(r){return r.text();})
        .then(function(xml){
          var items=[];
          var parts=String(xml).split(/<item[\s>]/i);
          for(var i=1;i<parts.length&&items.length<25;i++){
            var block=parts[i].split(/<\/item>/i)[0]||'';
            var title=(block.match(/<title[^>]*>(?:<!\[CDATA\[([\s\S]*?)\]\]>|([^<]*))<\/title>/i)||[]);
            title=(title[1]||title[2]||'').trim();
            var link=(block.match(/<link[^>]*>([^<]+)<\/link>/i)||[])[1]||'';
            var desc=(block.match(/<description[^>]*>(?:<!\[CDATA\[([\s\S]*?)\]\]>|([^<]*))<\/description>/i)||[]);
            desc=(desc[1]||desc[2]||'').replace(/<[^>]+>/g,' ').trim().slice(0,180);
            if(title)items.push({title:title,link:link,desc:desc,source:'Google Cricket',image:'',pub:''});
          }
          return items;
        })
        .catch(function(){throw e1;});
    });
}

        h('div',{className:'filter-row',style:{marginBottom:10}},
          h('button',{className:squadTeam==='home'?'on':'',onClick:function(){setSquadTeam('home');}},homeName||'Home'),
          h('button',{className:squadTeam==='away'?'on':'',onClick:function(){setSquadTeam('away');}},awayName||'Away')
        ),
        (function(){
          var list=d&&d.lineup||[];
          var homeId=d&&d.localteam_id;
          var awayId=d&&d.visitorteam_id;
          var filtered=list.filter(function(p){
            var tid=p.team_id!=null?p.team_id:(p.team&&(p.team.id||p.team_id));
            var tname=(p.team&&p.team.name)||p.team_name||'';
            if(squadTeam==='home'){
              if(tid!=null&&homeId!=null)return String(tid)===String(homeId);
              if(tname&&homeName)return String(tname).toLowerCase()===String(homeName).toLowerCase();
              return false;
            }
            if(tid!=null&&awayId!=null)return String(tid)===String(awayId);
            if(tname&&awayName)return String(tname).toLowerCase()===String(awayName).toLowerCase();
            return false;
          });
          if(!filtered.length&&list.length){
            var mid=Math.ceil(list.length/2);
            filtered=squadTeam==='home'?list.slice(0,mid):list.slice(mid);
          }
          if(!list.length)return h('div',{className:'muted'},loading?'Loading…':'No lineup on this fixture yet.');
          if(!filtered.length)return h('div',{className:'muted'},'No players listed for this team.');
          return h('div',null,
            filtered.slice(0,25).map(function(p,i){
              var pl=p.player||p;
              var name=playerName(p)||playerName(pl)||'Player';
              var img=p.image_path||pl.image_path||'';
              var role=roleText(p.position)||roleText(p.role)||roleText(pl.position)||roleText(pl.battingstyle)||'';
              var arm=roleText(p.bowlingstyle)||roleText(p.battingstyle)||roleText(pl.bowlingstyle)||roleText(pl.battingstyle)||'';
              var sub=[role,arm].filter(Boolean).join(' · ')||'—';
              return h('div',{key:i,style:{display:'flex',gap:10,alignItems:'center',padding:'8px 0',borderBottom:'1px solid var(--line)'}},
                img?h('img',{src:img,alt:'',style:{width:36,height:36,borderRadius:18,objectFit:'cover',background:'#333'}}):h('div',{style:{width:36,height:36,borderRadius:18,background:'rgba(127,127,127,.2)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:800}},(name||'?')[0]),
                h('div',null,
                  h('div',{style:{fontWeight:800,fontSize:13}},name),
                  h('div',{className:'muted',style:{fontSize:11}},sub)
                )
              );
            })
          );
        })()
      )):null,

      tab==='info'?(!selected?h('div',{className:'empty'},'Select a match'):h('div',{className:'card'},
        h('h3',null,'Match info'),
        h('div',{className:'kv'},
          h('div',{className:'item'},h('div',{className:'k'},'Home'),h('div',{className:'v'},homeName)),
          h('div',{className:'item'},h('div',{className:'k'},'Away'),h('div',{className:'v'},awayName)),
          h('div',{className:'item'},h('div',{className:'k'},'League'),h('div',{className:'v'},league||'—')),
          h('div',{className:'item'},h('div',{className:'k'},'Venue'),h('div',{className:'v'},venue||'—')),
          h('div',{className:'item'},h('div',{className:'k'},'Status'),h('div',{className:'v'},status||st||'—')),
          h('div',{className:'item'},h('div',{className:'k'},'Start'),h('div',{className:'v'},fmtWhen(d&&d.starting_at)||'—')),
          h('div',{className:'item'},h('div',{className:'k'},'Toss'),h('div',{className:'v'},(d&&d.tosswon&&d.tosswon.name)||'—')),
          h('div',{className:'item'},h('div',{className:'k'},'Man of match'),h('div',{className:'v'},playerName(d&&d.manofmatch)||'—'))
        ),
        null
      )):null
    ),

    inapp?h('div',{className:'inapp'},
      h('div',{className:'inapp-bar'},
        h('button',{className:'btn',onClick:function(){setInapp(null);}},'← Back'),
        h('div',{className:'title'},inapp.title||'Article'),
        h('button',{className:'btn',onClick:function(){try{window.open(inapp.url,'_blank');}catch(e){}}},'Browser')
      ),
      h('div',{style:{padding:16,overflow:'auto',flex:1}},
        h('div',{style:{fontWeight:800,fontSize:16,marginBottom:8}},inapp.title),
        inapp.desc?h('p',{style:{fontSize:14,lineHeight:1.5,color:'var(--muted)'}},inapp.desc):h('p',{className:'muted'},'Full article pages often show cookie banners inside the app. Use summary from the feed, or open in Browser.'),
        h('div',{className:'btn-row',style:{marginTop:16}},
          h('button',{className:'btn primary',onClick:function(){
            try{window.open(inapp.url,'_blank','noopener');}catch(e){}
          }},'Open full article'),
          h('button',{className:'btn',onClick:function(){
            speakText((inapp.title||'')+'. '+(inapp.desc||''),'en');
          }},'Read aloud')
        ),
        h('p',{className:'muted',style:{marginTop:12,fontSize:12}},'In-app web pages (Cricinfo/Google) require cookie consent on their sites. MCS keeps the feed summary here to avoid that loop.')
      )
    ):null,
    h('div',{className:'footer'},'MyCricStats · Sportmonks Cricket')
  );
}

var root=document.getElementById('root');
if(ReactDOM.createRoot)ReactDOM.createRoot(root).render(h(App));
else ReactDOM.render(h(App),root);
})();
</script>
</body>
</html>
