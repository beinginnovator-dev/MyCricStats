<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#a81732"><title>MyCricStats Live</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172333;font:15px system-ui,-apple-system,Segoe UI,Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:14px}.score{--board:#a81732;--edge:#d15b70;position:relative;background:var(--board);color:#fff;border:2px solid var(--edge);border-radius:24px;padding:20px 18px 18px;box-shadow:0 14px 30px #17233324}.heading{text-align:center;font-weight:900;font-size:17px;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.subheading{text-align:center;color:#f0dce0;font-size:11px;font-weight:800;letter-spacing:.5px;margin-top:5px}.status{text-align:center;color:#ffe0a0;font-size:11px;font-weight:900;margin-top:8px}.presented{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;margin:0 auto 15px;color:#fff;font-weight:900}.presented small{display:block;width:100%;text-align:center;font-size:10px;letter-spacing:1.4px;color:#f4dce1}.presented img{max-width:64px;max-height:42px;object-fit:contain;border-radius:8px}.presented strong{font-size:18px}.teams{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;border:1.5px solid var(--edge);border-radius:17px;background:#00000018;margin-top:12px;overflow:hidden}.team{min-width:0;padding:14px 7px;text-align:center}.team .flag{font-size:28px}.team .name{font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}.team .scoreline{font-size:30px;font-weight:950;line-height:1.2;margin-top:7px}.team .overs{font-size:12px;font-weight:800;color:#f0dce0;margin-top:2px}.vs{font-weight:900;font-size:13px;color:#ffe0a0;padding:0 4px}.players{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.player{min-width:0;padding:11px 12px;border:1px solid #ffffff45;border-radius:13px;background:#00000014}.player .label{font-size:10px;font-weight:900;letter-spacing:.8px;color:#f2d9df}.player .name{font-weight:900;font-size:14px;margin-top:3px;overflow-wrap:anywhere}.player .figures{font-size:11px;color:#f2e4e7;margin-top:3px;line-height:1.45}.meta{text-align:center;color:#f2e4e7;font-size:12px;font-weight:800;margin-top:13px}.target{text-align:center;color:#ffe09a;font-weight:900;font-size:12px;margin-top:7px}.over{border-top:1px solid #ffffff50;margin-top:14px;padding-top:11px}.overTitle{font-size:10px;letter-spacing:1px;font-weight:900;color:#f2d9df}.balls{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.ball{background:#ffffff22;border:1px solid #ffffff40;border-radius:8px;padding:6px 10px;font-weight:900;font-size:12px}.commentary,.panel{background:#fff;border:1px solid #dce3ea;border-radius:16px;padding:15px;margin-top:14px;box-shadow:0 4px 16px #14283a0d}.commentary h3,.panel h3{margin:0 0 10px;font-size:12px;letter-spacing:.8px}.commentaryLine{font-weight:800;line-height:1.5;color:#26364a;animation:slide 2.6s ease-out}@keyframes slide{0%{opacity:0;transform:translateY(10px)}20%,100%{opacity:1;transform:translateY(0)}}.audioBtn{margin-top:9px;border:0;background:#9333ea;color:#fff;border-radius:12px;padding:9px 13px;font-weight:900}.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #e8edf2}.muted{color:#69798a;font-size:12px}.statusline{text-align:center;padding:8px;color:#617184;font-size:12px}.popup{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:20px;z-index:10}.popup[hidden]{display:none!important}.popupbox{max-width:420px;width:100%;background:white;color:#172333;border-radius:18px;padding:18px;box-shadow:0 20px 60px #0006}.popupbox button{float:right;border:0;border-radius:20px;padding:8px 13px;background:#14283a;color:#fff}.popupbox img{display:block;max-width:100%;max-height:190px;object-fit:contain;margin:10px auto}.adimg{max-width:100px;max-height:60px;object-fit:contain}@media(max-width:430px){.wrap{padding:10px}.score{padding:16px 12px}.team .scoreline{font-size:26px}.players{gap:7px}.player{padding:9px}.player .name{font-size:13px}}
</style></head>
<body><main class="wrap">
<div id="statusline" class="statusline">Loading live match…</div>
<section class="score" id="score" hidden>
<div class="presented" id="presentedBy" hidden></div>
<div class="heading" id="title">MATCH DAY</div><div class="subheading" id="subtitle">LIMITED OVERS · VENUE TBC</div>
<div class="status" id="matchStatus">● LIVE</div>
<div class="teams">
<div class="team"><div class="flag" id="flagA">🏏</div><div class="name" id="teamA">TEAM A</div><div class="scoreline" id="scoreA">Yet to bat</div><div class="overs" id="oversA"></div></div>
<div class="vs">VS</div>
<div class="team"><div class="flag" id="flagB">🏏</div><div class="name" id="teamB">TEAM B</div><div class="scoreline" id="scoreB">Yet to bat</div><div class="overs" id="oversB"></div></div>
</div>
<div class="players"><div class="player"><div class="label">STRIKER</div><div class="name" id="striker">—</div><div class="figures" id="strikerStats"></div></div><div class="player"><div class="label">BOWLER</div><div class="name" id="bowler">—</div><div class="figures" id="bowlerStats"></div></div></div>
<div class="player" style="margin-top:9px"><div class="label">NON-STRIKER</div><div class="name" id="nonStriker">—</div><div class="figures" id="nonStrikerStats"></div></div>
<div class="meta" id="meta">0.0 OV · CRR 0.00 · EXTRAS 0</div><div class="target" id="target"></div>
<div class="over" id="overPanel" hidden><div class="overTitle">THIS OVER</div><div class="balls" id="balls"></div></div>
</section>
<section class="commentary"><h3>LIVE COMMENTARY</h3><div id="commentaryText" class="commentaryLine">Waiting for next delivery…</div><button class="audioBtn" id="audioBtn">ENABLE TTS COMMENTARY</button></section>
<section class="panel" id="adsPanel" hidden><h3>ADVERTISEMENT</h3><div id="ads"></div></section>
<section class="panel"><h3 id="scheduleTitle">TOURNAMENT SCHEDULE</h3><div id="scheduleRows"></div></section>
<div class="statusline" id="updated">Waiting for first update</div></main>
<div id="popup" class="popup" hidden><div class="popupbox"><button id="closePopup">Close ✕</button><h3 id="popupTitle">Advertisement</h3><div id="popupContent"></div></div></div>
<script>
const id=new URLSearchParams(location.search).get('id');const el=x=>document.getElementById(x);let lastDeliveryKey='',ttsEnabled=false,shownAds=new Set(),popupIndex=0,loading=false;
const safeUrl=v=>{try{const u=new URL(v,location.href);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}};
function closePopup(e){if(e){e.preventDefault();e.stopPropagation()}el('popup').hidden=true;try{sessionStorage.setItem('mcs_popup_closed_'+id,'1')}catch{}}
el('closePopup').addEventListener('click',closePopup);el('popup').addEventListener('click',e=>{if(e.target===el('popup'))closePopup(e)});
el('audioBtn').onclick=()=>{ttsEnabled=true;el('audioBtn').textContent='TTS COMMENTARY ON';if('speechSynthesis'in window)speechSynthesis.speak(new SpeechSynthesisUtterance('Live commentary enabled'))};
function commentaryFor(d){if(!d)return 'Waiting for next delivery…';if(d.dismissal)return d.bowler+' to '+d.batter+' — OUT! '+String(d.dismissal).replaceAll('_',' ');if(d.label==='4'||d.label==='6')return d.bowler+' to '+d.batter+' — '+(d.label==='4'?'FOUR!':'SIX!');if(d.type==='wide')return d.bowler+' to '+d.batter+' — wide ball';if(d.type==='noBall')return d.bowler+' to '+d.batter+' — no ball';return d.bowler+' to '+d.batter+' — '+(d.runs||0)+' run'+(d.runs===1?'':'s');}
function addAd(root,ad){const row=document.createElement('div');row.className='row';if(ad.image&&safeUrl(ad.image)){const img=document.createElement('img');img.className='adimg';img.src=safeUrl(ad.image);img.alt=ad.name||'Advertisement';row.append(img)}const name=document.createElement('strong');name.textContent=ad.name||'Sponsor';row.append(name);const href=safeUrl(ad.link);if(href){const a=document.createElement('a');a.href=href;a.target='_blank';a.rel='noopener';a.textContent='Visit';row.append(a)}root.append(row)}
async function load(){if(loading)return;loading=true;try{if(!id)throw new Error('Missing match ID in viewer URL.');const r=await fetch('/api/live/'+encodeURIComponent(id),{cache:'no-store'});if(!r.ok)throw new Error('Live match data unavailable (HTTP '+r.status+').');const payload=await r.json(),state=payload.state||{},m=state.match||{},innings=m.inningsList||[],inn=innings[Math.max(0,innings.length-1)]||{},first=innings[0]||{},a=state.teamA||{},b=state.teamB||{},players=state.players||[],settings=m.settings||{};
const byId=x=>players.find(p=>p.id===x)||{},byName=x=>players.find(p=>p.name===x)||{},fmt=x=>(x?.runs??0)+'/'+(x?.wickets??0),overs=x=>x?Math.floor((x.legalBalls||0)/6)+'.'+((x.legalBalls||0)%6):'0.0';
const isAFirst=(m.firstBattingTeamId||m.actualFirstBattingTeamId)===(m.teamAId||a.id),breakNow=m.status==='Innings Break',scoreA=isAFirst?first:(m.innings===2?inn:null),scoreB=isAFirst?(m.innings===2?inn:null):first,display=breakNow?first:inn;
const theme=settings.scoreboardTheme||'Black',palette=theme==='Red'?['#a81732','#d15b70']:theme==='Blue'?['#124f9f','#75a9e8']:['#080d16','#344253'];el('score').style.setProperty('--board',palette[0]);el('score').style.setProperty('--edge',palette[1]);
el('title').textContent=(settings.title||'MATCH DAY').toUpperCase();el('subtitle').textContent=(settings.matchType||'LIMITED OVERS').toUpperCase()+' · '+((settings.venue||'VENUE TBC').toUpperCase());el('matchStatus').textContent=(m.status||'LIVE').toUpperCase()+' · FANS ONLINE '+(payload.viewerCount??'');
el('flagA').textContent=a.flag||'🏏';el('flagB').textContent=b.flag||'🏏';el('teamA').textContent=a.name||m.teamA||'TEAM A';el('teamB').textContent=b.name||m.teamB||'TEAM B';
el('scoreA').textContent=scoreA?fmt(scoreA):'Yet to bat';el('scoreB').textContent=scoreB?fmt(scoreB):'Yet to bat';el('oversA').textContent=scoreA?'('+overs(scoreA)+' OV)':'Batting next';el('oversB').textContent=scoreB?'('+overs(scoreB)+' OV)':'Batting next';
const st=byId(display.striker),ns=byId(display.nonStriker),bw=byId(display.bowler);el('striker').textContent=st.name||'Not selected';el('strikerStats').textContent=(st.runs||0)+' ('+(st.balls||0)+') · SR '+(st.balls?(st.runs*100/st.balls).toFixed(1):'0.0')+' · 4s '+(st.fours||0)+' · 6s '+(st.sixes||0);el('nonStriker').textContent=ns.name||'—';el('nonStrikerStats').textContent=(ns.runs||0)+' ('+(ns.balls||0)+')';el('bowler').textContent=bw.name||'Not selected';el('bowlerStats').textContent=(bw.bowlRuns||0)+' runs · '+(bw.bowlBalls||0)+' balls · '+(bw.wickets||0)+' W · '+(bw.dots||0)+' dots · Econ '+(bw.bowlBalls?(bw.bowlRuns/(bw.bowlBalls/6)).toFixed(2):'0.00');
el('meta').textContent=overs(display)+' OV · CRR '+(display.legalBalls?(display.runs/(display.legalBalls/6)).toFixed(2):'0.00')+' · EXTRAS '+(display.extras||0);el('target').textContent=inn.target?'TARGET '+inn.target+' · NEED '+Math.max(0,inn.target-(inn.runs||0))+' RUNS':'';
const balls=display.overBalls||[];el('overPanel').hidden=!balls.length;el('balls').replaceChildren();balls.forEach(v=>{const span=document.createElement('span');span.className='ball';span.textContent=v;el('balls').append(span)});
const sponsor=(state.advertising?.enabled!==false?(state.sponsors||[]):[])[0],pb=el('presentedBy');pb.replaceChildren();if(sponsor){const small=document.createElement('small');small.textContent='PRESENTED BY';pb.append(small);if(sponsor.image&&safeUrl(sponsor.image)){const img=document.createElement('img');img.src=safeUrl(sponsor.image);img.alt=sponsor.name||'Sponsor';pb.append(img)}const strong=document.createElement('strong');strong.textContent=sponsor.name||'Sponsor';pb.append(strong);pb.hidden=false}else pb.hidden=true;
const d=(display.deliveries||[]).slice(-1)[0];if(d){const key=JSON.stringify([m.innings,d.label,d.batter,d.bowler,(display.deliveries||[]).length]);const line=commentaryFor(d);el('commentaryText').textContent=line;if(lastDeliveryKey&&key!==lastDeliveryKey&&ttsEnabled&&'speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(line))}lastDeliveryKey=key}
const fixtures=(state.tournament?.fixtures||[]).slice().sort((x,y)=>(Date.parse(y.date)||0)-(Date.parse(x.date)||0));el('scheduleTitle').textContent=(state.tournament?.name||'TOURNAMENT')+' · MATCH SCHEDULE';const rows=el('scheduleRows');rows.replaceChildren();if(!fixtures.length){const p=document.createElement('div');p.className='muted';p.textContent='No fixtures have been published yet.';rows.append(p)}fixtures.forEach(fx=>{const row=document.createElement('div');row.className='row';const left=document.createElement('strong'),right=document.createElement('span');const ta=(state.teams||[]).find(t=>t.id===fx.teamAId),tb=(state.teams||[]).find(t=>t.id===fx.teamBId);left.textContent=(ta?.flag||'🏏')+' '+(fx.teamAName||ta?.name||'Team A')+' vs '+(tb?.flag||'🏏')+' '+(fx.teamBName||tb?.name||'Team B');const dt=Date.parse(fx.date);right.textContent=(fx.type||'Match')+' · '+(Number.isNaN(dt)?'Date TBC':new Date(dt).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'numeric',minute:'2-digit'}));row.append(left,right);rows.append(row)});
const ads=state.advertising?.enabled!==false?(state.popupAds||[]):[];el('adsPanel').hidden=!ads.length;el('ads').replaceChildren();ads.forEach(ad=>addAd(el('ads'),ad));
if(ads.length&&!shownAds.has(id+':'+ads.length)&&(()=>{try{return sessionStorage.getItem('mcs_popup_closed_'+id)!=='1'}catch{return true}})()){const ad=ads[popupIndex++%ads.length];shownAds.add(id+':'+ads.length);el('popupTitle').textContent=ad.name||'Advertisement';const content=el('popupContent');content.replaceChildren();if(ad.image&&safeUrl(ad.image)){const im=document.createElement('img');im.src=safeUrl(ad.image);im.alt=ad.name||'Advertisement';content.append(im)}if(ad.link&&safeUrl(ad.link)){const link=document.createElement('a');link.href=safeUrl(ad.link);link.target='_blank';link.rel='noopener';link.textContent='Visit sponsor';content.append(link)}el('popup').hidden=false}
el('score').hidden=!m.status;el('statusline').textContent=m.status==='Completed'?'MATCH COMPLETED':m.status==='Innings Break'?'INNINGS BREAK':'● LIVE MATCH';el('updated').textContent='Last updated '+new Date(payload.updatedAt||Date.now()).toLocaleTimeString();
}catch(e){el('statusline').textContent=e.message}finally{loading=false}}
load();setInterval(load,4000);
</script></body></html>
